services:
  postgres:
    image: postgres:17

    container_name: trading-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: trading

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
