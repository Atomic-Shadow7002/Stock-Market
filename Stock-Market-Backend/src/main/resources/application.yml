spring:
  application:
    name: trading

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900
  refresh-token-expiry: 604800

logging:
  level:
    com.luffy.trading: DEBUG
    org.springframework.security: DEBUG

otp:
  sender: logging # dev default; switch to "twilio" once implemented
  cleanup-interval-ms: 600000 # 10 min between expired-OTP sweeps

admin:
  seed:
    phone: ${ADMIN_SEED_PHONE:+910000000001}
    password: ${ADMIN_SEED_PASSWORD:ChangeMe@123}
    first-name: ${ADMIN_SEED_FIRST_NAME:Admin}
    last-name: ${ADMIN_SEED_LAST_NAME:User}
    email: ${ADMIN_SEED_EMAIL:}
